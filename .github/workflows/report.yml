name: Weekly Meta Report

on:
  schedule:
    - cron: "30 5 * * 3" # Wednesday 11:00 AM IST
  workflow_dispatch:

jobs:
  weekly-report:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: weekly-report-service

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: weekly-report-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run weekly report
        run: npm run weekly-report
        env:
          FRESHSALES_MCP_URL: ${{ secrets.FRESHSALES_MCP_URL }}
          META_MCP_OAUTH_SESSION_PATH: ${{ secrets.META_MCP_OAUTH_SESSION_PATH }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          NOTIFICATION_CHANNEL: notion
          CORRELATION_WINDOW_WEEKS: "6"
          CRON_JITTER_MINUTES: "30"
          META_MCP_CALL_TIMEOUT_MS: "240000"
          REPORT_OUTPUT_DIR: reports
