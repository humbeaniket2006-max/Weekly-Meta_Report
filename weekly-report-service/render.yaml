services:
  - type: cron
    name: weekly-report-orchestrator
    runtime: node
    schedule: "30 5 * * 3"
    buildCommand: npm install && npm run build
    startCommand: npm run weekly-report
    envVars:
      - key: FRESHSALES_MCP_URL
        sync: false
      - key: META_MCP_OAUTH_SESSION_PATH
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: NOTIFICATION_CHANNEL
        value: notion
      - key: CORRELATION_WINDOW_WEEKS
        value: "6"
      - key: CRON_JITTER_MINUTES
        value: "30"
      - key: META_MCP_CALL_TIMEOUT_MS
        value: "240000"
      - key: REPORT_OUTPUT_DIR
        value: reports
